name: Build Video Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Android Video Player Project
      shell: bash
      run: |

        mkdir -p app/src/main/java/com/example/universalplayer
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat <<'EOF' > settings.gradle

        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.name = "VideoManager"
        include(":app")

        EOF

        cat <<'EOF' > build.gradle

        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }

        EOF

        cat <<'EOF' > gradle.properties

        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true

        EOF

        cat <<'EOF' > app/build.gradle

        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.universalplayer'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.universalplayer"
                minSdk 26
                targetSdk 34
                versionCode 23
                versionName "23.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.13.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'androidx.media3:media3-common:1.2.1'
            implementation 'androidx.media3:media3-extractor:1.2.1'
        }

        EOF

        cat <<'EOF' > app/src/main/AndroidManifest.xml

