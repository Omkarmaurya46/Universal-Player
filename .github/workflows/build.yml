        package com.example.universalplayer

        import java.io.Serializable

        data class VideoItem(
            val id: Long,
            val title: String,
            var duration: String,
            val uriString: String,
            val filePath: String = "",
            val folder: String = "Internal",
            val isFolder: Boolean = false,
            val count: Int = 0
        ) : Serializable

        EOF

        cat <<'EOF' > app/src/main/java/com/example/universalplayer/VideoAdapter.kt

        package com.example.universalplayer

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.Button
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class VideoAdapter(
            private var list: List<VideoItem>,
            private val onClick: (Int) -> Unit,
            private val onMenu: (View, Int) -> Unit
        ) : RecyclerView.Adapter<VideoAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {

                val img: ImageView =
                    v.findViewById(R.id.imgThumb)

                val t: TextView =
                    v.findViewById(R.id.txtTitle)

                val d: TextView =
                    v.findViewById(R.id.txtDuration)

                val m: Button =
                    v.findViewById(R.id.btnItemMenu)
            }

            override fun onCreateViewHolder(
                parent: ViewGroup,
                viewType: Int
            ) =
                VH(
                    LayoutInflater
                        .from(parent.context)
                        .inflate(
                            R.layout.item_video,
                            parent,
                            false
                        )
                )

            override fun onBindViewHolder(
                holder: VH,
                position: Int
            ) {

                val item = list[position]

                holder.t.text = item.title

                holder.d.text =
                    if (item.isFolder)
                        "${item.count} Videos"
                    else
                        item.duration

                holder.img.setImageResource(
                    if (item.isFolder)
                        android.R.drawable.ic_menu_agenda
                    else
                        android.R.drawable.ic_media_play
                )

                holder.m.visibility =
                    if (item.isFolder)
                        View.GONE
                    else
                        View.VISIBLE

                holder.itemView.setOnClickListener {
                    onClick(position)
                }

                holder.m.setOnClickListener {
                    onMenu(it, position)
                }
            }

            override fun getItemCount() =
                list.size

            fun update(newList: List<VideoItem>) {
                list = newList
                notifyDataSetChanged()
            }
        }

        EOF

        c‍at <<'EOF' > app/src/main/java/com/example/universalplayer/MainActivity.kt

        package com.example.universalplayer

        import android.Manifest
        import android.content.ContentUris
        import android.content.ContentValues
        import android.content.Context
        import android.content.Intent
        import android.content.SharedPreferences
        import android.content.pm.PackageManager
        import android.media.MediaMetadataRetriever
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.text.Editable
        import android.text.TextWatcher
        import android.view.View
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import java.io.File
        import java.util.concurrent.TimeUnit
        import kotlin.concurrent.thread

        class MainActivity : AppCompatActivity() {

            private lateinit var rv: RecyclerView
            private lateinit var adapter: VideoAdapter

            private val allVideos =
                ArrayList<VideoItem>()

            private val currentDisplayList =
                ArrayList<VideoItem>()

            private var isFolderMode = false
            private var isBinMode = false
            private var searchQuery = ""

            private lateinit var prefs: SharedPreferences

            private val pickVideo =
                registerForActivityResult(
                    ActivityResultContracts.StartActivityForResult()
                ) { result ->

                    if (result.resultCode == RESULT_OK) {

                        result.data?.data?.let { uri ->

                            val single =
                                arrayListOf(
                                    VideoItem(
                                        0,
                                        "Selected Video",
                                        "00:00",
                                        uri.toString()
                                    )
                                )

                            startActivity(
                                Intent(
                                    this,
                                    PlayerActivity::class.java
                                ).apply {

                                    putExtra(
                                        "VIDEO_LIST",
                                        single
                                    )

                                    putExtra(
                                        "VIDEO_INDEX",
                                        0
                                    )
                                }
                            )
                        }
                    }
                }

            private val requestPermission =
                registerForActivityResult(
                    ActivityResultContracts.RequestPermission()
                ) { granted ->

                    if (granted)

                        loadVideos()

                    else

                        Toast.makeText(
                            this,
                            "Video permission is required.",
                            Toast.LENGTH_LONG
                        ).show()
                }

            override fun onCreate(
                savedInstanceState: Bundle?
            ) {

                super.onCreate(
                    savedInstanceState
                )

                setContentView(
                    R.layout.activity_main
                )

                prefs =
                    getSharedPreferences(
                        "VideoManagerPrefs",
                        Context.MODE_PRIVATE
                    )

                rv =
                    findViewById(
                        R.id.recyclerViewVideos
                    )

                rv.layoutManager =
                    LinearLayoutManager(this)

                adapter =
                    VideoAdapter(
                        currentDisplayList,
                        { idx ->
                            onItemClicked(idx)
                        },
                        { view, idx ->
                            showItemMenu(view, idx)
                        }
                    )

                rv.adapter = adapter

                findViewById<Button>(
                    R.id.btnOpenFile
                ).setOnClickListener {

                    val intent =
                        Intent(
                            Intent.ACTION_OPEN_DOCUMENT
                        ).apply {

                            addCategory(
                                Intent.CATEGORY_OPENABLE
                            )

                            type = "video/*"
                        }

                    pickVideo.launch(intent)
                }

                findViewById<Button>(
                    R.id.tabVideos
                ).setOnClickListener {

                    isFolderMode = false
                    isBinMode = false

                    updateView()
                }

                findViewById<Button>(
                    R.id.tabFolders
                ).setOnClickListener {

                    isFolderMode = true
                    isBinMode = false

                    updateView()
                }

                findViewById<Button>(
                    R.id.btnRecycleBin
                ).setOnClickListener {

                    isBinMode = true
                    isFolderMode = false

                    updateView()
                }

                findViewById<EditText>(
                    R.id.etSearchVideos
                ).addTextChangedListener(

                    object : TextWatcher {

                        override fun beforeTextChanged(
                            s: CharSequence?,
                            start: Int,
                            count: Int,
                            after: Int
                        ) {}

                        override fun onTextChanged(
                            s: CharSequence?,
                            start: Int,
                            before: Int,
                            count: Int
                        ) {

                            searchQuery =
                                s?.toString()
                                    ?.trim()
                                    .orEmpty()

                            updateView()
                        }

                        override fun afterTextChanged(
                            s: Editable?
                        ) {}
                    }
                )

                checkPermission()
            }

            override fun onResume() {

                super.onResume()

                if (::prefs.isInitialized)
                    loadVideos()
            }

            private fun checkPermission() {

                val permission =
                    if (Build.VERSION.SDK_INT >= 33)

                        Manifest.permission
                            .READ_MEDIA_VIDEO

                    else

                        Manifest.permission
                            .READ_EXTERNAL_STORAGE

                if (
                    ContextCompat.checkSelfPermission(
                        this,
                        permission
                    ) ==
                    PackageManager.PERMISSION_GRANTED
                ) {

                    loadVideos()

                } else {

                    requestPermission.launch(
                        permission
                    )
                }
            }

            private fun loadVideos() {

                thread {

                    val loaded =
                        ArrayList<VideoItem>()

                    val binSet =
                        prefs.getStringSet(
                            "bin_items",
                            emptySet()
                        ) ?: emptySet()

                    val projection =
                        arrayOf(

                            MediaStore.Video.Media._ID,

                            MediaStore.Video.Media
                                .DISPLAY_NAME,

                            MediaStore.Video.Media
                                .DURATION,

                            MediaStore.Video.Media
                                .DATA,

                            MediaStore.Video.Media
                                .BUCKET_DISPLAY_NAME
                        )

                    contentResolver.query(

                        MediaStore.Video.Media
                            .EXTERNAL_CONTENT_URI,

                        projection,

                        null,
                        null,

                        "${MediaStore.Video.Media.DATE_ADDED} DESC"

                    )?.use { c ->

                        val idCol =
                            c.getColumnIndexOrThrow(
                                MediaStore.Video.Media._ID
                            )

                        val nameCol =
                            c.getColumnIndexOrThrow(
                                MediaStore.Video.Media
                                    .DISPLAY_NAME
                            )

                        val durCol =
                            c.getColumnIndexOrThrow(
                                MediaStore.Video.Media
                                    .DURATION
                            )

                        val dataCol =
                            c.getColumnIndex(
                                MediaStore.Video.Media.DATA
                            )

                        val bucketCol =
                            c.getColumnIndex(
                                MediaStore.Video.Media
                                    .BUCKET_DISPLAY_NAME
                            )

                        while (c.moveToNext()) {

                            val id =
                                c.getLong(idCol)

                            if (
                                binSet.contains(
                                    id.toString()
                                )
                            )
                                continue

                            val name =
                                c.getString(
                                    nameCol
                                ) ?: "Video"

                            val durationMs =
                                c.getLong(durCol)

                            val path =
                                if (dataCol >= 0)
                                    c.getString(dataCol)
                                        ?: ""
                                else
                                    ""

                            val folder =
                                if (bucketCol >= 0)
                                    c.getString(
                                        bucketCol
                                    ) ?: "Internal"
                                else
                                    "Internal"

                            val uri =
                                ContentUris.withAppendedId(
                                    MediaStore.Video.Media
                                        .EXTERNAL_CONTENT_URI,
                                    id
                                )

                            loaded.add(

                                VideoItem(

                                    id,

                                    name,

                                    if (durationMs > 0)
                                        formatDuration(
                                            durationMs
                                        )
                                    else
                                        "00:00",

                                    uri.toString(),

                                    path,

                                    folder
                                )
                            )
                        }
                    }

                    runOnUiThread {

                        allVideos.clear()

                        allVideos.addAll(
                            loaded
                        )

                        updateView()
                    }

                    for (item in loaded) {

                        if (
                            item.duration != "00:00"
                        )
                            continue

                        try {

                            val retriever =
                                MediaMetadataRetriever()

                            if (
                                item.filePath.isNotEmpty()
                                &&
                                File(
                                    item.filePath
                                ).exists()
                            ) {

                                retriever.setDataSource(
                                    item.filePath
                                )

                            } else {

                                retriever.setDataSource(
                                    this@MainActivity,
                                    Uri.parse(
                                        item.uriString
                                    )
                                )
                            }

                            val ms =
                                retriever.extractMetadata(
                                    MediaMetadataRetriever
                                        .METADATA_KEY_DURATION
                                )
                                ?.toLongOrNull()
                                ?: 0L

                            retriever.release()

                            if (ms > 0) {

                                item.duration =
                                    formatDuration(ms)

                                runOnUiThread {

                                    adapter
                                        .notifyDataSetChanged()
                                }
                            }

                        } catch (_: Exception) {}
                    }
                }
            }

            private fun formatDuration(
                ms: Long
            ): String {

                val hrs =
                    TimeUnit.MILLISECONDS
                        .toHours(ms)

                val mins =
                    TimeUnit.MILLISECONDS
                        .toMinutes(ms) % 60

                val secs =
                    TimeUnit.MILLISECONDS
                        .toSeconds(ms) % 60

                return if (hrs > 0)

                    String.format(
                        "%02d:%02d:%02d",
                        hrs,
                        mins,
                        secs
                    )

                else

                    String.format(
                        "%02d:%02d",
                        mins,
                        secs
                    )
            }

            private fun updateView() {

                currentDisplayList.clear()

                val binSet =
                    prefs.getStringSet(
                        "bin_items",
                        emptySet()
                    ) ?: emptySet()

                val source =

                    if (isBinMode)

                        allVideos.filter {
                            binSet.contains(
                                it.id.toString()
                            )
                        }

                    else

                        allVideos.filter {
                            !binSet.contains(
                                it.id.toString()
                            )
                        }

                if (isBinMode) {

                    findViewById<TextView>(
                        R.id.txtHeaderTitle
                    ).text = "Recycle Bin"

                    currentDisplayList
                        .addAll(source)

                } else if (isFolderMode) {

                    findViewById<TextView>(
                        R.id.txtHeaderTitle
                    ).text = "All Folders"

                    source
                        .groupBy { it.folder }
                        .forEach { (folder, list) ->

                            currentDisplayList.add(

                                VideoItem(
                                    0,
                                    folder,
                                    "",
                                    "",
                                    "",
                                    folder,
                                    true,
                                    list.size
                                )
                            )
                        }

                } else {

                    findViewById<TextView>(
                        R.id.txtHeaderTitle
                    ).text = "All Videos"

                    currentDisplayList
                        .addAll(source)
                }

                val filtered =

                    if (searchQuery.isBlank())

                        currentDisplayList

                    else

                        currentDisplayList.filter {
                            it.title.contains(
                                searchQuery,
                                ignoreCase = true
                            )
                        }

                adapter.update(
                    filtered
                )
            }

            private fun onItemClicked(
                idx: Int
            ) {

                if (
                    idx !in currentDisplayList.indices
                )
                    return

                val item =
                    currentDisplayList[idx]

                val binSet =
                    prefs.getStringSet(
                        "bin_items",
                        emptySet()
                    ) ?: emptySet()

                if (item.isFolder) {

                    val folderVideos =
                        ArrayList(

                            allVideos.filter {

                                it.folder ==
                                    item.title

                                &&
                                !binSet.contains(
                                    it.id.toString()
                                )
                            }
                        )

                    if (
                        folderVideos.isNotEmpty()
                    ) {

                        startActivity(

                            Intent(
                                this,
                                PlayerActivity::class.java
                            ).apply {

                                putExtra(
                                    "VIDEO_LIST",
                                    folderVideos
                                )

                                putExtra(
                                    "VIDEO_INDEX",
                                    0
                                )
                            }
                        )
                    }

                    return
                }

                val playList =
                    ArrayList(

                        currentDisplayList.filter {
                            !it.isFolder
                        }
                    )

                val playIndex =
                    playList
                        .indexOf(item)
                        .coerceAtLeast(0)

                startActivity(

                    Intent(
                        this,
                        PlayerActivity::class.java
                    ).apply {

                        putExtra(
                            "VIDEO_LIST",
                            playList
                        )

                        putExtra(
                            "VIDEO_INDEX",
                            playIndex
                        )
                    }
                )
            }

            private fun showItemMenu(
                anchor: View,
                idx: Int
            ) {

                if (
                    idx !in currentDisplayList.indices
                )
                    return

                val item =
                    currentDisplayList[idx]

                if (item.isFolder)
                    return

                val popup =
                    android.widget.PopupMenu(
                        this,
                        anchor
                    )

                if (isBinMode) {

                    popup.menu.add(
                        "Restore"
                    )

                    popup.menu.add(
                        "Delete Permanently"
                    )

                } else {

                    popup.menu.add(
                        "File Information"
                    )

                    popup.menu.add(
                        "Rename"
                    )

                    popup.menu.add(
                        "Move to Recycle Bin"
                    )
                }

                popup.setOnMenuItemClickListener {

                    when (
                        it.title.toString()
                    ) {

                        "File Information" ->
                            showFileInfoDialog(item)

                        "Restore" -> {

                            val set =
                                HashSet(

                                    prefs.getStringSet(
                                        "bin_items",
                                        emptySet()
                                    ) ?: emptySet()
                                )

                            set.remove(
                                item.id.toString()
                            )

                            prefs.edit()
                                .putStringSet(
                                    "bin_items",
                                    set
                                )
                                .apply()

                            updateView()
                        }

                        "Move to Recycle Bin" -> {

                            val set =
                                HashSet(

                                    prefs.getStringSet(
                                        "bin_items",
                                        emptySet()
                                    ) ?: emptySet()
                                )

                            set.add(
                                item.id.toString()
                            )

                            prefs.edit()
                                .putStringSet(
                                    "bin_items",
                                    set
                                )
                                .apply()

                            updateView()
                        }

                        "Delete Permanently" ->
                            permanentlyDelete(item)

                        "Rename" ->
                            renameVideo(item)
                    }

                    true
                }

                popup.show()
            }

            private fun renameVideo(
                item: VideoItem
            ) {

                val input =
                    EditText(this).apply {

                        setText(
                            item.title
                        )

                        selectAll()
                    }

                AlertDialog.Builder(this)

                    .setTitle(
                        "Rename Video"
                    )

                    .setView(
                        input
                    )

                    .setPositiveButton(
                        "Save"
                    ) { _, _ ->

                        try {

                            val values =
                                ContentValues().apply {

                                    put(
                                        MediaStore
                                            .Video
                                            .Media
                                            .DISPLAY_NAME,

                                        input.text.toString()
                                    )
                                }

                            contentResolver.update(

                                Uri.parse(
                                    item.uriString
                                ),

                                values,

                                null,
                                null
                            )

                            loadVideos()

                        } catch (e: Exception) {

                            Toast.makeText(
                                this,
                                "Rename failed: ${e.message}",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    }

                    .setNegativeButton(
                        "Cancel",
                        null
                    )

                    .show()
            }

            private fun permanentlyDelete(
                item: VideoItem
            ) {

                AlertDialog.Builder(this)

                    .setTitle(
                        "Delete Permanently?"
                    )

                    .setMessage(
                        "This will remove the video from device storage."
                    )

                    .setPositiveButton(
                        "Delete"
                    ) { _, _ ->

                        try {

                            contentResolver.delete(

                                Uri.parse(
                                    item.uriString
                                ),

                                null,
                                null
                            )

                            if (
                                item.filePath.isNotEmpty()
                            ) {

                                runCatching {

                                    File(
                                        item.filePath
                                    ).delete()
                                }
                            }

                            val set =
                                HashSet(

                                    prefs.getStringSet(
                                        "bin_items",
                                        emptySet()
                                    ) ?: emptySet()
                                )

                            set.remove(
                                item.id.toString()
                            )

                            prefs.edit()
                                .putStringSet(
                                    "bin_items",
                                    set
                                )
                                .apply()

                            loadVideos()

                        } catch (e: Exception) {

                            Toast.makeText(
                                this,
                                "Delete failed: ${e.message}",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    }

                    .setNegativeButton(
                        "Cancel",
                        null
                    )

                    .show()
            }

            private fun showFileInfoDialog(
                item: VideoItem
            ) {

                val file =
                    if (
                        item.filePath.isNotEmpty()
                    )
                        File(item.filePath)
                    else
                        null

                val size =
                    if (
                        file?.exists() == true
                    )
                        String.format(
                            "%.2f MB",
                            file.length()
                                .toDouble() /
                                (1024 * 1024)
                        )
                    else
                        "Unknown"

                var resolution =
                    "Unknown"

                var mime =
                    "Unknown"

                try {

                    val retriever =
                        MediaMetadataRetriever()

                    if (
                        item.filePath.isNotEmpty()
                        &&
                        File(
                            item.filePath
                        ).exists()
                    ) {

                        retriever.setDataSource(
                            item.filePath
                        )

                    } else {

                        retriever.setDataSource(
                            this,
                            Uri.parse(
                                item.uriString
                            )
                        )
                    }

                    val w =
                        retriever.extractMetadata(
                            MediaMetadataRetriever
                                .METADATA_KEY_VIDEO_WIDTH
                        )

                    val h =
                        retriever.extractMetadata(
                            MediaMetadataRetriever
                                .METADATA_KEY_VIDEO_HEIGHT
                        )

                    if (
                        !w.isNullOrBlank()
                        &&
                        !h.isNullOrBlank()
                    ) {

                        resolution =
                            "${w}x${h}"
                    }

                    mime =
                        retriever.extractMetadata(
                            MediaMetadataRetriever
                                .METADATA_KEY_MIMETYPE
                        ) ?: "Unknown"

                    retriever.release()

                } catch (_: Exception) {}

                val message = """

                    File Name: ${item.title}

                    Size: $size

                    Duration: ${item.duration}

                    Resolution: $resolution

                    Format: $mime

                    Path: ${item.filePath.ifEmpty { item.uriString }}

                    Folder: ${item.folder}

                """.trimIndent()

                AlertDialog.Builder(this)

                    .setTitle(
                        "Video Information"
                    )

                    .setMessage(
                        message
                    )

                    .setPositiveButton(
                        "OK",
                        null
                    )

                    .show()
            }
        }

