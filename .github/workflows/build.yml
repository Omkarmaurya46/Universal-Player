name: Build Universal Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Full Android Video Player Project
      run: |
        mkdir -p app/src/main/java/com/example/universalplayer
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Universal-Player"
        include ':app'
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.universalplayer'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.universalplayer"
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName "3.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'androidx.media3:media3-common:1.2.1'
            implementation 'androidx.media3:media3-extractor:1.2.1'
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_media_play"
                android:label="Universal Player"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity
                    android:name=".PlayerActivity"
                    android:exported="false"
                    android:configChanges="orientation|screenSize|screenLayout" />
            </application>
        </manifest>
        EOF

        # Strings
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Universal Player</string>
        </resources>
        EOF

        # Layout: activity_main.xml (Video List Screen)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#121212">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:padding="16dp"
                android:gravity="center_vertical">

                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="All Device Videos"
                    android:textColor="#FFFFFF"
                    android:textSize="20sp"
                    android:textStyle="bold" />

                <Button
                    android:id="@+id/btnOpenFile"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Open File" />
            </LinearLayout>

            <androidx.recyclerview.widget.RecyclerView
                android:id="@+id/recyclerViewVideos"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </LinearLayout>
        EOF

        # Layout: item_video.xml
        cat << 'EOF' > app/src/main/res/layout/item_video.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:padding="12dp"
            android:gravity="center_vertical"
            android:background="?android:attr/selectableItemBackground">

            <ImageView
                android:layout_width="48dp"
                android:layout_height="48dp"
                android:src="@android:drawable/ic_media_play"
                android:tint="#00E676" />

            <LinearLayout
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:orientation="vertical"
                android:layout_marginStart="16dp">

                <TextView
                    android:id="@+id/txtTitle"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#FFFFFF"
                    android:textSize="15sp"
                    android:textStyle="bold"
                    android:maxLines="1"
                    android:ellipsize="end" />

                <TextView
                    android:id="@+id/txtDuration"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#AAAAAA"
                    android:textSize="13sp"
                    android:layout_marginTop="4dp" />
            </LinearLayout>
        </LinearLayout>
        EOF

        # Layout: activity_player.xml (Gesture Player Screen)
        cat << 'EOF' > app/src/main/res/layout/activity_player.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#000000">

            <androidx.media3.ui.PlayerView
                android:id="@+id/playerView"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                app:use_controller="true"
                app:show_buffering="always"
                app:resize_mode="fit" />

            <TextView
                android:id="@+id/txtGestureIndicator"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_centerInParent="true"
                android:padding="16dp"
                android:background="#99000000"
                android:textColor="#FFFFFF"
                android:textSize="18sp"
                android:textStyle="bold"
                android:visibility="gone" />
        </RelativeLayout>
        EOF

        # VideoItem.kt
        cat << 'EOF' > app/src/main/java/com/example/universalplayer/VideoItem.kt
        package com.example.universalplayer

        import android.net.Uri

        data class VideoItem(
            val id: Long,
            val title: String,
            val duration: String,
            val uri: Uri
        )
        EOF

        # VideoAdapter.kt
        cat << 'EOF' > app/src/main/java/com/example/universalplayer/VideoAdapter.kt
        package com.example.universalplayer

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class VideoAdapter(
            private val videos: List<VideoItem>,
            private val onClick: (VideoItem) -> Unit
        ) : RecyclerView.Adapter<VideoAdapter.ViewHolder>() {

            class ViewHolder(v: View) : RecyclerView.ViewHolder(v) {
                val txtTitle: TextView = v.findViewById(R.id.txtTitle)
                val txtDuration: TextView = v.findViewById(R.id.txtDuration)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_video, parent, false)
                return ViewHolder(view)
            }

            override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                val video = videos[position]
                holder.txtTitle.text = video.title
                holder.txtDuration.text = video.duration
                holder.itemView.setOnClickListener { onClick(video) }
            }

            override fun getItemCount() = videos.size
        }
        EOF

        # MainActivity.kt (Lists device videos & file picker)
        cat << 'EOF' > app/src/main/java/com/example/universalplayer/MainActivity.kt
        package com.example.universalplayer

        import android.Manifest
        import android.content.ContentUris
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import java.util.concurrent.TimeUnit

        class MainActivity : AppCompatActivity() {

            private lateinit var recyclerView: RecyclerView
            private val videoList = mutableListOf<VideoItem>()

            private val pickVideoLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                if (res.resultCode == RESULT_OK) {
                    res.data?.data?.let { uri ->
                        val intent = Intent(this, PlayerActivity::class.java).apply {
                            putExtra("VIDEO_URI", uri.toString())
                            putExtra("VIDEO_TITLE", "Custom Video")
                        }
                        startActivity(intent)
                    }
                }
            }

            private val requestPermission = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { map ->
                if (map.values.any { it }) {
                    loadVideos()
                } else {
                    Toast.makeText(this, "Storage permission is needed to show videos", Toast.LENGTH_LONG).show()
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                recyclerView = findViewById(R.id.recyclerViewVideos)
                recyclerView.layoutManager = LinearLayoutManager(this)

                findViewById<Button>(R.id.btnOpenFile).setOnClickListener {
                    val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                        addCategory(Intent.CATEGORY_OPENABLE)
                        type = "*/*"
                    }
                    pickVideoLauncher.launch(intent)
                }

                checkAndRequestPermissions()
            }

            private fun checkAndRequestPermissions() {
                val perms = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    arrayOf(Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO)
                } else {
                    arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                }

                if (perms.all { ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED }) {
                    loadVideos()
                } else {
                    requestPermission.launch(perms)
                }
            }

            private fun loadVideos() {
                videoList.clear()
                val projection = arrayOf(
                    MediaStore.Video.Media._ID,
                    MediaStore.Video.Media.DISPLAY_NAME,
                    MediaStore.Video.Media.DURATION
                )

                contentResolver.query(
                    MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                    projection,
                    null,
                    null,
                    "${MediaStore.Video.Media.DATE_ADDED} DESC"
                )?.use { cursor ->
                    val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                    val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                    val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)

                    while (cursor.moveToNext()) {
                        val id = cursor.getLong(idCol)
                        val name = cursor.getString(nameCol) ?: "Unknown"
                        val durMs = cursor.getLong(durCol)
                        val durStr = String.format("%02d:%02d",
                            TimeUnit.MILLISECONDS.toMinutes(durMs),
                            TimeUnit.MILLISECONDS.toSeconds(durMs) % 60
                        )
                        val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                        videoList.add(VideoItem(id, name, durStr, uri))
                    }
                }

                recyclerView.adapter = VideoAdapter(videoList) { selectedVideo ->
                    val intent = Intent(this, PlayerActivity::class.java).apply {
                        putExtra("VIDEO_URI", selectedVideo.uri.toString())
                        putExtra("VIDEO_TITLE", selectedVideo.title)
                    }
                    startActivity(intent)
                }
            }
        }
        EOF

        # PlayerActivity.kt (Universal Playit & Smart Muxer Decoders + Volume & Brightness Gestures)
        cat << 'EOF' > app/src/main/java/com/example/universalplayer/PlayerActivity.kt
