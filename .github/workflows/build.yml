        cat << 'EOF' > app/src/main/java/com/example/universalplayer/VideoItem.kt
        package com.example.universalplayer
        import java.io.Serializable
        data class VideoItem(
            val id: Long,
            val title: String,
            val duration: String,
            val uriString: String,
            val folder: String = "Internal",
            val isFolder: Boolean = false,
            val count: Int = 0
        ) : Serializable
        EOF

        cat << 'EOF' > app/src/main/java/com/example/universalplayer/VideoAdapter.kt
        package com.example.universalplayer
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.Button
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class VideoAdapter(
            private var list: List<VideoItem>,
            private val onClick: (Int) -> Unit,
            private val onMenu: (View, Int) -> Unit
        ) : RecyclerView.Adapter<VideoAdapter.VH>() {
            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val img: ImageView = v.findViewById(R.id.imgThumb)
                val t: TextView = v.findViewById(R.id.txtTitle)
                val d: TextView = v.findViewById(R.id.txtDuration)
                val m: Button = v.findViewById(R.id.btnItemMenu)
            }
            override fun onCreateViewHolder(p: ViewGroup, vt: Int) = VH(LayoutInflater.from(p.context).inflate(R.layout.item_video, p, false))
            override fun onBindViewHolder(h: VH, pos: Int) {
                val item = list[pos]
                h.t.text = item.title
                h.d.text = if (item.isFolder) "${item.count} Videos" else item.duration
                h.img.setImageResource(if (item.isFolder) android.R.drawable.ic_dialog_dialer else android.R.drawable.ic_media_play)
                h.m.visibility = if (item.isFolder) View.GONE else View.VISIBLE
                h.itemView.setOnClickListener { onClick(pos) }
                h.m.setOnClickListener { onMenu(it, pos) }
            }
            override fun getItemCount() = list.size
            fun update(newList: List<VideoItem>) { list = newList; notifyDataSetChanged() }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/universalplayer/MainActivity.kt
        package com.example.universalplayer
        import android.Manifest
        import android.content.*
        import android.content.pm.PackageManager
        import android.os.*
        import android.provider.MediaStore
        import android.text.Editable
        import android.text.TextWatcher
        import android.view.View
        import android.widget.*
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import java.util.concurrent.TimeUnit

        class MainActivity : AppCompatActivity() {
            private lateinit var rv: RecyclerView
            private lateinit var adapter: VideoAdapter
            private val allVideos = ArrayList<VideoItem>()
            private val currentDisplayList = ArrayList<VideoItem>()
            private var isFolderMode = false
            private var isBinMode = false
            private lateinit var prefs: SharedPreferences

            private val pickVideo = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                if (res.resultCode == RESULT_OK) res.data?.data?.let {
                    val single = arrayListOf(VideoItem(0, "Selected Video", "00:00", it.toString()))
                    startActivity(Intent(this, PlayerActivity::class.java).apply {
                        putExtra("VIDEO_LIST", single)
                        putExtra("VIDEO_INDEX", 0)
                    })
                }
            }
            private val reqPerms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { map ->
                if (map.values.any { it }) loadVideos()
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                prefs = getSharedPreferences("RecycleBinPrefs", Context.MODE_PRIVATE)

                rv = findViewById(R.id.recyclerViewVideos)
                rv.layoutManager = LinearLayoutManager(this)
                adapter = VideoAdapter(currentDisplayList, { idx -> onItemClicked(idx) }, { v, idx -> showItemMenu(v, idx) })
                rv.adapter = adapter

                findViewById<Button>(R.id.btnOpenFile).setOnClickListener {
                    val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "*/*" }
                    pickVideo.launch(intent)
                }

                findViewById<Button>(R.id.tabVideos).setOnClickListener {
                    isFolderMode = false; isBinMode = false
                    updateView()
                }
                findViewById<Button>(R.id.tabFolders).setOnClickListener {
                    isFolderMode = true; isBinMode = false
                    updateView()
                }
                findViewById<Button>(R.id.btnRecycleBin).setOnClickListener {
                    isBinMode = true
                    updateView()
                }

                findViewById<EditText>(R.id.etSearchVideos).addTextChangedListener(object : TextWatcher {
                    override fun beforeTextChanged(s: CharSequence?, b: Int, c: Int, a: Int) {}
                    override fun onTextChanged(s: CharSequence?, b: Int, c: Int, a: Int) {
                        val q = s.toString().trim()
                        val filtered = currentDisplayList.filter { it.title.contains(q, true) }
                        adapter.update(if (q.isEmpty()) currentDisplayList else filtered)
                    }
                    override fun afterTextChanged(e: Editable?) {}
                })
                checkPerms()
            }

            private fun checkPerms() {
                val perms = if (Build.VERSION.SDK_INT >= 33) arrayOf(Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.READ_MEDIA_IMAGES)
                else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                if (perms.all { ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED }) loadVideos()
                else reqPerms.launch(perms)
            }

            private fun loadVideos() {
                allVideos.clear()
                val binSet = prefs.getStringSet("bin_items", emptySet()) ?: emptySet()
                val proj = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.DURATION, MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, proj, null, null, "${MediaStore.Video.Media.DATE_ADDED} DESC")?.use { c ->
                    val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                    val nameCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                    val durCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                    val bucketCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                    while (c.moveToNext()) {
                        val id = c.getLong(idCol)
                        val ms = c.getLong(durCol)
                        val dur = String.format("%02d:%02d", TimeUnit.MILLISECONDS.toMinutes(ms), TimeUnit.MILLISECONDS.toSeconds(ms) % 60)
                        val u = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id).toString()
                        val folder = c.getString(bucketCol) ?: "Internal"
                        allVideos.add(VideoItem(id, c.getString(nameCol) ?: "Video", dur, u, folder))
                    }
                }
                updateView()
            }

            private fun updateView() {
                currentDisplayList.clear()
                val binSet = prefs.getStringSet("bin_items", emptySet()) ?: emptySet()
                val titleView = findViewById<TextView>(R.id.txtHeaderTitle)

                if (isBinMode) {
                    titleView.text = "Recycle Bin"
                    currentDisplayList.addAll(allVideos.filter { binSet.contains(it.id.toString()) })
                } else if (isFolderMode) {
                    titleView.text = "Folders"
                    val valid = allVideos.filter { !binSet.contains(it.id.toString()) }
                    val map = valid.groupBy { it.folder }
                    for ((folder, list) in map) {
                        currentDisplayList.add(VideoItem(0, folder, "", "", folder, true, list.size))
                    }
                } else {
                    titleView.text = "All Videos"
                    currentDisplayList.addAll(allVideos.filter { !binSet.contains(it.id.toString()) })
                }
                adapter.update(currentDisplayList)
            }

            private fun onItemClicked(idx: Int) {
                if (idx !in currentDisplayList.indices) return
                val item = currentDisplayList[idx]
                if (item.isFolder) {
                    val binSet = prefs.getStringSet("bin_items", emptySet()) ?: emptySet()
                    val folderVideos = ArrayList(allVideos.filter { it.folder == item.title && !binSet.contains(it.id.toString()) })
                    startActivity(Intent(this, PlayerActivity::class.java).apply {
                        putExtra("VIDEO_LIST", folderVideos)
                        putExtra("VIDEO_INDEX", 0)
                    })
                } else {
                    val playList = ArrayList(currentDisplayList.filter { !it.isFolder })
                    val playIndex = playList.indexOf(item).coerceAtLeast(0)
                    startActivity(Intent(this, PlayerActivity::class.java).apply {
                        putExtra("VIDEO_LIST", playList)
                        putExtra("VIDEO_INDEX", playIndex)
                    })
                }
            }

            private fun showItemMenu(v: View, idx: Int) {
                if (idx !in currentDisplayList.indices) return
                val item = currentDisplayList[idx]
                val p = PopupMenu(this, v)
                if (isBinMode) {
                    p.menu.add("Restore")
                    p.menu.add("Delete Permanently")
                } else {
                    p.menu.add("Rename")
                    p.menu.add("Move to Recycle Bin")
                    p.menu.add("Delete Permanently")
                }
                p.setOnMenuItemClickListener { m ->
                    when (m.title) {
                        "Restore" -> {
                            val binSet = HashSet(prefs.getStringSet("bin_items", emptySet()) ?: emptySet())
                            binSet.remove(item.id.toString())
                            prefs.edit().putStringSet("bin_items", binSet).apply()
                            updateView()
                        }
                        "Move to Recycle Bin" -> {
                            val binSet = HashSet(prefs.getStringSet("bin_items", emptySet()) ?: emptySet())
                            binSet.add(item.id.toString())
                            prefs.edit().putStringSet("bin_items", binSet).apply()
                            updateView()
                        }
                        "Delete Permanently" -> {
                            AlertDialog.Builder(this).setTitle("Delete Permanently?").setMessage("Are you sure?").setPositiveButton("Delete") { _, _ ->
                                try {
                                    contentResolver.delete(android.net.Uri.parse(item.uriString), null, null)
                                    val binSet = HashSet(prefs.getStringSet("bin_items", emptySet()) ?: emptySet())
                                    binSet.remove(item.id.toString())
                                    prefs.edit().putStringSet("bin_items", binSet).apply()
                                    loadVideos()
                                } catch (e: Exception) { Toast.makeText(this, "Cannot delete file directly: ${e.message}", Toast.LENGTH_SHORT).show() }
                            }.setNegativeButton("Cancel", null).show()
                        }
                        "Rename" -> {
                            val et = EditText(this).apply { setText(item.title) }
                            AlertDialog.Builder(this).setTitle("Rename Video").setView(et).setPositiveButton("Save") { _, _ ->
                                try {
                                    val vals = ContentValues().apply { put(MediaStore.Video.Media.DISPLAY_NAME, et.text.toString()) }
                                    contentResolver.update(android.net.Uri.parse(item.uriString), vals, null, null)
                                    loadVideos()
                                } catch (e: Exception) { Toast.makeText(this, "Rename failed: ${e.message}", Toast.LENGTH_SHORT).show() }
                            }.setNegativeButton("Cancel", null).show()
                        }
                    }
                    true
                }
                p.show()
            }
        }
