        cat << 'EOF' > app/src/main/java/com/example/universalplayer/PlayerActivity.kt
        package com.example.universalplayer
        import android.app.PictureInPictureParams
        import android.content.*
        import android.content.pm.ActivityInfo
        import android.graphics.Bitmap
        import android.media.*
        import android.net.Uri
        import android.os.*
        import android.provider.MediaStore
        import android.util.Rational
        import android.view.*
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.*
        import androidx.media3.exoplayer.DefaultRenderersFactory
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.extractor.DefaultExtractorsFactory
        import androidx.media3.extractor.ts.DefaultTsPayloadReaderFactory
        import androidx.media3.ui.AspectRatioFrameLayout
        import androidx.media3.ui.PlayerView
        import java.io.*
        import java.nio.ByteBuffer
        import java.text.SimpleDateFormat
        import java.util.*
        import kotlin.concurrent.thread
        import kotlin.math.abs

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var pv: PlayerView
            private lateinit var txtInd: TextView
            private lateinit var txtClock: TextView
            private lateinit var txtBattery: TextView
            private lateinit var topBar: View
            private lateinit var bottomBar: View
            private lateinit var btnLock: Button
            private lateinit var rightControls: View
            private lateinit var btnPlay: Button
            private lateinit var seekBar: SeekBar
            private lateinit var txtTime: TextView
            private lateinit var am: AudioManager
            private lateinit var gd: GestureDetector
            private lateinit var scaleDetector: ScaleGestureDetector

            private var videoList = ArrayList<VideoItem>()
            private var curIdx = 0
            private var maxVol = 15
            private var curVolProgress = 0f
            private var curBri = 0.5f
            private var isLand = false
            private var isLock = false
            private var ccOn = true
            private var zoomMode = 0
            private var swipeSeekPos = 0L
            private var isSeekingViaSwipe = false
            private var customScale = 1.0f
            private var transX = 0f
            private var transY = 0f
            private val handler = Handler(Looper.getMainLooper())

            private val batteryReceiver = object : BroadcastReceiver() {
                override fun onReceive(c: Context?, intent: Intent?) {
                    val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                    val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                    if (level >= 0 && scale > 0) txtBattery.text = "🔋 ${(level * 100) / scale}%"
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                setContentView(R.layout.activity_player)

                pv = findViewById(R.id.playerView)
                txtInd = findViewById(R.id.txtIndicator)
                txtClock = findViewById(R.id.txtClock)
                txtBattery = findViewById(R.id.txtBattery)
                topBar = findViewById(R.id.topBar)
                bottomBar = findViewById(R.id.bottomBar)
                btnLock = findViewById(R.id.btnLock)
                rightControls = findViewById(R.id.rightControls)
                btnPlay = findViewById(R.id.btnPlayPause)
                seekBar = findViewById(R.id.seekBar)
                txtTime = findViewById(R.id.txtTime)

                am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                maxVol = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                curVolProgress = am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat()
                registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))

                val list = intent.getSerializableExtra("VIDEO_LIST") as? ArrayList<VideoItem>
                if (list != null) videoList = list
                curIdx = intent.getIntExtra("VIDEO_INDEX", 0)

                updateClock()
                setupClicks()
                setupGestures()
                playVideoAtIndex(curIdx)
            }

            private fun playVideoAtIndex(idx: Int) {
                if (videoList.isEmpty() || idx !in 0 until videoList.size) return
                curIdx = idx
                val item = videoList[curIdx]
                initPlayer(Uri.parse(item.uriString))
            }

            private fun updateClock() {
                txtClock.text = SimpleDateFormat("hh:mm a", Locale.getDefault()).format(Date())
                handler.postDelayed({ updateClock() }, 10000)
            }

            private fun setupClicks() {
                btnLock.setOnClickListener {
                    isLock = !isLock
                    btnLock.text = if (isLock) "🔒" else "🔓"
                    val v = if (isLock) View.GONE else View.VISIBLE
                    topBar.visibility = v; bottomBar.visibility = v; rightControls.visibility = v
                    show(if (isLock) "Locked" else "Unlocked")
                }
                findViewById<Button>(R.id.btnSnapshot).setOnClickListener { takeSnap() }
                findViewById<Button>(R.id.btnPiP).setOnClickListener { enterPiP() }
                btnPlay.setOnClickListener {
                    player?.let {
                        if (it.isPlaying) { it.pause(); btnPlay.text = "▶" }
                        else { it.play(); btnPlay.text = "⏸" }
                    }
                }
                findViewById<Button>(R.id.btnPrev).setOnClickListener {
                    if (curIdx > 0) playVideoAtIndex(curIdx - 1) else show("First Video")
                }
                findViewById<Button>(R.id.btnNext).setOnClickListener {
                    if (curIdx < videoList.size - 1) playVideoAtIndex(curIdx + 1) else show("Last Video")
                }
                findViewById<Button>(R.id.btnSpeed).setOnClickListener { showSpeedDialog() }
                findViewById<Button>(R.id.btnZoom).setOnClickListener {
                    zoomMode = (zoomMode + 1) % 3
                    val btn = it as Button
                    customScale = 1.0f; transX = 0f; transY = 0f
                    applyZoomAndPan()
                    when (zoomMode) {
                        0 -> { pv.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT; btn.text = "FIT" }
                        1 -> { pv.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL; btn.text = "STRETCH" }
                        2 -> { pv.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM; btn.text = "ZOOM" }
                    }
                }
                findViewById<Button>(R.id.btnRotate).setOnClickListener {
                    isLand = !isLand
                    requestedOrientation = if (isLand) ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE else ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                }
                findViewById<Button>(R.id.btnMenu).setOnClickListener { showMenuOptions(it) }

                seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                        if (fromUser) player?.seekTo(p.toLong())
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })
            }

            private fun applyZoomAndPan() {
                val sv = pv.videoSurfaceView ?: return
                sv.scaleX = customScale
                sv.scaleY = customScale
                sv.translationX = transX
                sv.translationY = transY
            }

            private fun showSpeedDialog() {
                val opts = arrayOf("0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "1.75x", "2.0x", "Custom Speed")
                val vals = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 1.75f, 2.0f)
                AlertDialog.Builder(this).setTitle("Playback Speed").setItems(opts) { _, idx ->
                    if (idx < vals.size) {
                        player?.playbackParameters = PlaybackParameters(vals[idx])
                        show("Speed: ${opts[idx]}")
                    } else {
                        val et = EditText(this).apply { hint = "e.g. 1.35"; setRawInputType(android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL) }
                        AlertDialog.Builder(this).setTitle("Enter Custom Speed").setView(et).setPositiveButton("Set") { _, _ ->
                            val sp = et.text.toString().toFloatOrNull() ?: 1.0f
                            player?.playbackParameters = PlaybackParameters(sp)
                            show("Speed: ${sp}x")
                        }.show()
                    }
                }.show()
            }

            private fun showMenuOptions(v: View) {
                val p = PopupMenu(this, v)
                p.menu.add(0, 1, 0, "🎵 Save MP3")
                p.menu.add(0, 2, 0, if (ccOn) "CC: Subtitles OFF" else "CC: Subtitles ON")
                p.menu.add(0, 3, 0, "🎧 Audio Track")
                p.setOnMenuItemClickListener { m ->
                    when (m.itemId) {
                        1 -> {
                            if (videoList.isNotEmpty()) {
                                val item = videoList[curIdx]
                                show("Saving MP3...")
                                thread { saveAudio(Uri.parse(item.uriString), item.title) }
                            }
                        }
                        2 -> {
                            ccOn = !ccOn
                            player?.trackSelectionParameters?.let { params ->
                                player?.trackSelectionParameters = params.buildUpon().setTrackTypeDisabled(C.TRACK_TYPE_TEXT, !ccOn).build()
                            }
                            show(if (ccOn) "CC ON" else "CC OFF")
                        }
                        3 -> showAudioTrackSelection()
                    }
                    true
                }
                p.show()
            }

            private fun showAudioTrackSelection() {
                val tracks = player?.currentTracks ?: return
                val audioTrackList = ArrayList<String>()
                val trackGroupList = ArrayList<Pair<TrackGroup, Int>>()
                for (group in tracks.groups) {
                    if (group.type == C.TRACK_TYPE_AUDIO) {
                        for (i in 0 until group.length) {
                            val format = group.getTrackFormat(i)
                            val lang = format.language ?: "Track ${audioTrackList.size + 1}"
                            val label = "${lang} (${format.sampleMimeType ?: "Audio"})"
                            audioTrackList.add(label)
                            trackGroupList.add(Pair(group.mediaTrackGroup, i))
                        }
                    }
                }
                if (audioTrackList.isEmpty()) { show("No Multiple Tracks Found"); return }
                AlertDialog.Builder(this).setTitle("Select Audio Track").setItems(audioTrackList.toTypedArray()) { _, i ->
                    val pair = trackGroupList[i]
                    player?.trackSelectionParameters = player?.trackSelectionParameters?.buildUpon()
                        ?.setOverrideForType(TrackSelectionOverride(pair.first, pair.second))?.build() ?: return@setItems
                    show("Selected: ${audioTrackList[i]}")
                }.show()
            }

            private fun enterPiP() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                } else show("PiP not supported")
            }

            override fun onUserLeaveHint() {
                super.onUserLeaveHint()
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && player?.isPlaying == true) {
                    enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                }
            }

            override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: android.content.res.Configuration) {
                super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                val v = if (isInPictureInPictureMode) View.GONE else View.VISIBLE
                topBar.visibility = v; bottomBar.visibility = v; btnLock.visibility = v; rightControls.visibility = v
            }

            private fun initPlayer(uri: Uri) {
                player?.release()
                val rf = DefaultRenderersFactory(this).setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER)
                val ef = DefaultExtractorsFactory().setConstantBitrateSeekingEnabled(true).setTsExtractorFlags(DefaultTsPayloadReaderFactory.FLAG_ALLOW_NON_IDR_KEYFRAMES)
                player = ExoPlayer.Builder(this, rf).setMediaSourceFactory(androidx.media3.exoplayer.source.DefaultMediaSourceFactory(this, ef)).build()
                pv.player = player
                player?.addListener(object : Player.Listener {
                    override fun onPlaybackStateChanged(s: Int) {
                        if (s == Player.STATE_READY) {
                            val dur = player?.duration ?: 0
                            seekBar.max = dur.toInt()
                            updateProgress()
                        }
                    }
                })
                player?.setMediaItem(MediaItem.fromUri(uri))
                player?.prepare(); player?.play()
                btnPlay.text = "⏸"
            }

            private fun updateProgress() {
                player?.let {
                    val cur = it.currentPosition
                    val dur = it.duration
                    seekBar.progress = cur.toInt()
                    txtTime.text = "${fmtTime(cur)} / ${fmtTime(dur)}"
                    if (it.isPlaying) handler.postDelayed({ updateProgress() }, 1000)
                }
            }

            private fun fmtTime(ms: Long): String {
                val m = (ms / 1000) / 60
                val s = (ms / 1000) % 60
                return String.format("%02d:%02d", m, s)
            }

            private fun saveAudio(uri: Uri, title: String) {
                try {
                    val ex = MediaExtractor()
                    ex.setDataSource(this, uri, null)
                    var aIdx = -1; var aFmt: MediaFormat? = null
                    for (i in 0 until ex.trackCount) {
                        val f = ex.getTrackFormat(i)
                        if ((f.getString(MediaFormat.KEY_MIME) ?: "").startsWith("audio/")) { aIdx = i; aFmt = f; break }
                    }
                    if (aIdx == -1 || aFmt == null) { runOnUiThread { show("No Audio!") }; ex.release(); return }
                    ex.selectTrack(aIdx)
                    val tmp = File(cacheDir, "t.m4a")
                    val muxer = MediaMuxer(tmp.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                    val trk = muxer.addTrack(aFmt)
                    muxer.start()
                    val buf = ByteBuffer.allocate(1024 * 1024)
                    val info = MediaCodec.BufferInfo()
                    while (true) {
                        val sz = ex.readSampleData(buf, 0)
                        if (sz < 0) break
                        info.set(0, sz, ex.sampleTime, ex.sampleFlags)
                        muxer.writeSampleData(trk, buf, info)
                        ex.advance()
                    }
                    muxer.stop(); muxer.release(); ex.release()
                    val vals = ContentValues().apply {
                        put(MediaStore.MediaColumns.DISPLAY_NAME, "${title.substringBeforeLast(".")}_Audio.mp3")
                        put(MediaStore.MediaColumns.MIME_TYPE, "audio/mp3")
                        if (Build.VERSION.SDK_INT >= 29) put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/VideoPlayer")
                    }
                    contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, vals)?.let { outUri ->
                        contentResolver.openOutputStream(outUri)?.use { os -> FileInputStream(tmp).use { it.copyTo(os) } }
                    }
                    tmp.delete()
                    runOnUiThread { show("Saved to Music/VideoPlayer!"); Toast.makeText(this, "Saved as MP3!", Toast.LENGTH_LONG).show() }
                } catch (e: Exception) { runOnUiThread { show("Failed: ${e.message}") } }
            }

            private fun takeSnap() {
                val sv = pv.videoSurfaceView
                if (sv is TextureView) {
                    sv.bitmap?.let { bm ->
                        val vals = ContentValues().apply {
                            put(MediaStore.MediaColumns.DISPLAY_NAME, "Snap_${System.currentTimeMillis()}.jpg")
                            put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                            if (Build.VERSION.SDK_INT >= 29) put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/VideoPlayer")
                        }
                        contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, vals)?.let { u ->
                            contentResolver.openOutputStream(u)?.use { bm.compress(Bitmap.CompressFormat.JPEG, 100, it) }
                        }
                        show("HD Photo Saved!")
                    }
                }
            }

            private fun setupGestures() {
                scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    override fun onScale(d: ScaleGestureDetector): Boolean {
                        if (zoomMode == 2) {
                            customScale = (customScale * d.scaleFactor).coerceIn(1.0f, 4.0f)
                            applyZoomAndPan()
                            show("Zoom: ${(customScale * 100).toInt()}%")
                            return true
                        }
                        return false
                    }
                })

                gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isLock) return false
                        val v = if (bottomBar.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                        topBar.visibility = v; bottomBar.visibility = v; btnLock.visibility = v; rightControls.visibility = v
                        return true
                    }

                    override fun onDoubleTap(e: MotionEvent): Boolean {
                        if (isLock) return false
                        val fwd = e.x > resources.displayMetrics.widthPixels / 2
                        player?.seekTo(if (fwd) (player?.currentPosition ?: 0) + 10000 else maxOf((player?.currentPosition ?: 0) - 10000, 0))
                        show(if (fwd) ">> +10s" else "<< -10s")
                        return true
                    }

                    override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dx: Float, dy: Float): Boolean {
                        if (isLock || e1 == null) return false
                        val width = resources.displayMetrics.widthPixels

                        if (e2.pointerCount >= 2 && zoomMode == 2) {
                            transX -= dx
                            transY -= dy
                            applyZoomAndPan()
                            return true
                        }

                        if (abs(dx) > abs(dy)) {
                            if (!isSeekingViaSwipe) {
                                isSeekingViaSwipe = true
                                swipeSeekPos = player?.currentPosition ?: 0L
                            }
                            val dur = player?.duration ?: 0L
                            swipeSeekPos = (swipeSeekPos + (-dx * 200).toLong()).coerceIn(0L, dur)
                            val icon = if (dx < 0) ">>" else "<<"
                            show("$icon ${fmtTime(swipeSeekPos)} / ${fmtTime(dur)}")
                            return true
                        }

                        if (e1.x > width / 2) {
                            curVolProgress = (curVolProgress + (dy / 70f)).coerceIn(0f, maxVol.toFloat())
                            am.setStreamVolume(AudioManager.STREAM_MUSIC, curVolProgress.toInt(), 0)
                            show("Vol: ${((curVolProgress / maxVol) * 100).toInt()}%")
                        } else {
                            curBri = (curBri + (dy / 2500f)).coerceIn(0.01f, 1.0f)
                            window.attributes = window.attributes.apply { screenBrightness = curBri }
                            show("Bri: ${(curBri * 100).toInt()}%")
                        }
                        return true
                    }
                })

                pv.setOnTouchListener { _, ev ->
                    scaleDetector.onTouchEvent(ev)
                    gd.onTouchEvent(ev)
                    if (ev.action == MotionEvent.ACTION_UP) {
                        if (isSeekingViaSwipe) {
                            player?.seekTo(swipeSeekPos)
                            isSeekingViaSwipe = false
                        }
                        txtInd.postDelayed({ txtInd.visibility = View.GONE }, 1000)
                    }
                    true
                }
            }

            private fun show(msg: String) { txtInd.text = msg; txtInd.visibility = View.VISIBLE }
            override fun onDestroy() {
                super.onDestroy()
                unregisterReceiver(batteryReceiver)
                player?.release()
                player = null
            }
        }
