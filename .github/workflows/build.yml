        # MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/universalplayer/MainActivity.kt
        package com.example.universalplayer

        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class MainActivity : AppCompatActivity() {

            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView

            private val pickVideo = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                if (res.resultCode == Activity.RESULT_OK) {
                    res.data?.data?.let { uri ->
                        playMedia(uri)
                    }
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                playerView = findViewById(R.id.playerView)
                val btn = findViewById<Button>(R.id.btnPick)

                player = ExoPlayer.Builder(this).build()
                playerView.player = player

                btn.setOnClickListener {
                    val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                        addCategory(Intent.CATEGORY_OPENABLE)
                        type = "*/*"
                    }
                    pickVideo.launch(intent)
                }
            }

            private fun playMedia(uri: Uri) {
                try {
                    val mediaItem = MediaItem.fromUri(uri)
                    player?.setMediaItem(mediaItem)
                    player?.prepare()
                    player?.play()
                } catch (e: Exception) {
                    Toast.makeText(this, "Error playing file: ${e.message}", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                player = null
            }
        }
        EOF

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
