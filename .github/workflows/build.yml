                    when (it.itemId) {

                        1 -> {

                            if (
                                videoList.isNotEmpty()
                            ) {

                                val item =
                                    videoList[curIdx]

                                showIndicator(
                                    "Saving audio..."
                                )

                                thread {

                                    saveAudioAsM4a(
                                        Uri.parse(
                                            item.uriString
                                        ),
                                        item.title
                                    )
                                }
                            }
                        }

                        2 -> {

                            ccOn = !ccOn

                            player?.trackSelectionParameters =
                                player
                                    ?.trackSelectionParameters
                                    ?.buildUpon()
                                    ?.setTrackTypeDisabled(
                                        C.TRACK_TYPE_TEXT,
                                        !ccOn
                                    )
                                    ?.build()
                                    ?: return@setOnMenuItemClickListener true

                            showIndicator(
                                if (ccOn)
                                    "CC ON"
                                else
                                    "CC OFF"
                            )
                        }

                        3 ->
                            showAudioTrackSelection()
                    }

                    true
                }

                popup.show()
            }

            private fun showAudioTrackSelection() {

                val tracks =
                    player?.currentTracks
                        ?: return

                val names =
                    ArrayList<String>()

                val overrides =
                    ArrayList<Pair<TrackGroup, Int>>()

                for (group in tracks.groups) {

                    if (
                        group.type !=
                        C.TRACK_TYPE_AUDIO
                    )
                        continue

                    for (
                        i in 0 until group.length
                    ) {

                        val format =
                            group.getTrackFormat(i)

                        val lang =
                            format.language
                                ?: "Track ${names.size + 1}"

                        val codec =
                            format.sampleMimeType
                                ?: "audio"

                        names.add(
                            "$lang ($codec)"
                        )

                        overrides.add(
                            Pair(
                                group.mediaTrackGroup,
                                i
                            )
                        )
                    }
                }

                if (names.isEmpty()) {

                    showIndicator(
                        "No multiple audio tracks"
                    )

                    return
                }

                AlertDialog.Builder(this)

                    .setTitle(
                        "Select Audio Track"
                    )

                    .setItems(
                        names.toTypedArray()
                    ) { _, index ->

                        val pair =
                            overrides[index]

                        player?.trackSelectionParameters =
                            player
                                ?.trackSelectionParameters
                                ?.buildUpon()
                                ?.setOverrideForType(
                                    TrackSelectionOverride(
                                        pair.first,
                                        pair.second
                                    )
                                )
                                ?.build()

                        showIndicator(
                            "Selected ${names[index]}"
                        )
                    }

                    .show()
            }

            private fun enterPiP() {

                if (
                    Build.VERSION.SDK_INT >=
                    Build.VERSION_CODES.O
                ) {

                    enterPictureInPictureMode(

                        PictureInPictureParams
                            .Builder()

                            .setAspectRatio(
                                Rational(
                                    16,
                                    9
                                )
                            )

                            .build()
                    )

                } else {

                    showIndicator(
                        "PiP not supported"
                    )
                }
            }

            override fun onUserLeaveHint() {

                super.onUserLeaveHint()

                if (
                    Build.VERSION.SDK_INT >=
                    Build.VERSION_CODES.O
                    &&
                    player?.isPlaying == true
                ) {

                    enterPiP()
                }
            }

            override fun onPictureInPictureModeChanged(
                isInPictureInPictureMode: Boolean,
                newConfig:
                    android.content.res.Configuration
            ) {

                super.onPictureInPictureModeChanged(
                    isInPictureInPictureMode,
                    newConfig
                )

                val visibility =
                    if (
                        isInPictureInPictureMode
                    )
                        View.GONE
                    else
                        View.VISIBLE

                topBar.visibility =
                    visibility

                bottomBar.visibility =
                    visibility

                btnLock.visibility =
                    visibility

                rightControls.visibility =
                    visibility
            }

            private fun initPlayer(
                uri: Uri
            ) {

                player?.release()

                val renderers =
                    DefaultRenderersFactory(this)
                        .setExtensionRendererMode(
                            DefaultRenderersFactory
                                .EXTENSION_RENDERER_MODE_PREFER
                        )

                val extractors =
                    DefaultExtractorsFactory()
                        .setConstantBitrateSeekingEnabled(
                            true
                        )

                        .setMp4ExtractorFlags(
                            Mp4Extractor
                                .FLAG_READ_SAMPLE_INDEX_DATA
                        )

                        .setTsExtractorFlags(
                            DefaultTsPayloadReaderFactory
                                .FLAG_ALLOW_NON_IDR_KEYFRAMES
                        )

                player =
                    ExoPlayer.Builder(
                        this,
                        renderers
                    )

                        .setMediaSourceFactory(
                            DefaultMediaSourceFactory(
                                this,
                                extractors
                            )
                        )

                        .build()

                pv.player =
                    player

                player?.addListener(
                    object :
                        Player.Listener {

                        override fun
                            onPlaybackStateChanged(
                                state: Int
                            ) {

                            if (
                                state ==
                                Player.STATE_READY
                            ) {

                                val duration =
                                    player?.duration
                                        ?: 0L

                                seekBar.max =
                                    duration
                                        .coerceAtMost(
                                            Int.MAX_VALUE.toLong()
                                        )
                                        .toInt()

                                updateProgress()
                            }
                        }

                        override fun onPlayerError(
                            error:
                                PlaybackException
                        ) {

                            Toast.makeText(
                                this@PlayerActivity,
                                "Playback error: ${error.message}",
                                Toast.LENGTH_LONG
                            ).show()
                        }
                    }
                )

                player?.setMediaItem(
                    MediaItem.fromUri(
                        uri
                    )
                )

                player?.prepare()
                player?.play()

                btnPlay.text =
                    "Pause"
            }

            private fun updateProgress() {

                player?.let {

                    val current =
                        it.currentPosition
                            .coerceAtLeast(0)

                    val duration =
                        it.duration
                            .coerceAtLeast(0)

                    seekBar.max =
                        duration
                            .coerceAtMost(
                                Int.MAX_VALUE.toLong()
                            )
                            .toInt()

                    seekBar.progress =
                        current
                            .coerceAtMost(
                                Int.MAX_VALUE.toLong()
                            )
                            .toInt()

                    txtTime.text =
                        "${fmtTime(current)} / ${fmtTime(duration)}"

                    if (it.isPlaying) {

                        handler.postDelayed(
                            {
                                updateProgress()
                            },
                            500
                        )
                    }
                }
            }

            private fun fmtTime(
                ms: Long
            ): String {

                val safe =
                    ms.coerceAtLeast(0)

                val hrs =
                    TimeUnit.MILLISECONDS
                        .toHours(safe)

                val mins =
                    TimeUnit.MILLISECONDS
                        .toMinutes(safe) % 60

                val secs =
                    TimeUnit.MILLISECONDS
                        .toSeconds(safe) % 60

                return if (hrs > 0)

                    String.format(
                        "%02d:%02d:%02d",
                        hrs,
                        mins,
                        secs
                    )

                else

                    String.format(
                        "%02d:%02d",
                        mins,
                        secs
                    )
            }

            private fun saveAudioAsM4a(
                uri: Uri,
                title: String
            ) {

                try {

                    val extractor =
                        MediaExtractor()

                    extractor.setDataSource(
                        this,
                        uri,
                        null
                    )

                    var audioIndex =
                        -1

                    var audioFormat:
                        MediaFormat? = null

                    for (
                        i in 0 until extractor.trackCount
                    ) {

                        val format =
                            extractor.getTrackFormat(i)

                        val mime =
                            format.getString(
                                MediaFormat.KEY_MIME
                            ) ?: ""

                        if (
                            mime.startsWith(
                                "audio/"
                            )
                        ) {

                            audioIndex =
                                i

                            audioFormat =
                                format

                            break
                        }
                    }

                    if (
                        audioIndex == -1 ||
                        audioFormat == null
                    ) {

                        extractor.release()

                        runOnUiThread {

                            showIndicator(
                                "No audio track"
                            )
                        }

                        return
                    }

                    extractor.selectTrack(
                        audioIndex
                    )

                    val temp =
                        File(
                            cacheDir,
                            "audio_${System.currentTimeMillis()}.m4a"
                        )

                    val muxer =
                        MediaMuxer(
                            temp.absolutePath,
                            MediaMuxer
                                .OutputFormat
                                .MUXER_OUTPUT_MPEG_4
                        )

                    val outputTrack =
                        muxer.addTrack(
                            audioFormat
                        )

                    muxer.start()

                    val buffer =
                        ByteBuffer.allocate(
                            1024 * 1024
                        )

                    val info =
                        MediaCodec.BufferInfo()

                    while (true) {

                        val size =
                            extractor.readSampleData(
                                buffer,
                                0
                            )

                        if (size < 0)
                            break

                        info.set(
                            0,
                            size,
                            extractor.sampleTime,
                            extractor.sampleFlags
                        )

                        muxer.writeSampleData(
                            outputTrack,
                            buffer,
                            info
                        )

                        extractor.advance()
                    }

                    muxer.stop()
                    muxer.release()
                    extractor.release()

                    val values =
                        android.content.ContentValues()
                            .apply {

                                put(
                                    MediaStore
                                        .MediaColumns
                                        .DISPLAY_NAME,

                                    "${title.substringBeforeLast(".")}_Audio.m4a"
                                )

                                put(
                                    MediaStore
                                        .MediaColumns
                                        .MIME_TYPE,
                                    "audio/mp4"
                                )

                                if (
                                    Build.VERSION.SDK_INT >= 29
                                ) {

                                    put(
                                        MediaStore
                                            .MediaColumns
                                            .RELATIVE_PATH,

                                        Environment
                                            .DIRECTORY_MUSIC
                                            +
                                            "/VideoPlayer"
                                    )
                                }
                            }

                    val outputUri =
                        contentResolver.insert(
                            MediaStore
                                .Audio
                                .Media
                                .EXTERNAL_CONTENT_URI,
                            values
                        )

                    if (
                        outputUri == null
                    ) {

                        temp.delete()

                        throw IllegalStateException(
                            "Could not create output file"
                        )
                    }

                    contentResolver
                        .openOutputStream(
                            outputUri
                        )
                        ?.use { output ->

                            FileInputStream(
                                temp
                            ).use { input ->

                                input.copyTo(
                                    output
                                )
                            }
                        }

                    temp.delete()

                    runOnUiThread {

                        showIndicator(
                            "Audio saved as M4A"
                        )

                        Toast.makeText(
                            this,
                            "Saved in Music/VideoPlayer",
                            Toast.LENGTH_LONG
                        ).show()
                    }

                } catch (e: Exception) {

                    runOnUiThread {

                        showIndicator(
                            "Audio failed: ${e.message}"
                        )
                    }
                }
            }

            private fun takeSnap() {

                val surface =
                    pv.videoSurfaceView

                if (
                    surface is TextureView
                ) {

                    val bitmap =
                        surface.bitmap
                            ?: run {

                                showIndicator(
                                    "Screenshot unavailable"
                                )

                                return
                            }

                    val values =
                        android.content.ContentValues()
                            .apply {

                                put(
                                    MediaStore
                                        .MediaColumns
                                        .DISPLAY_NAME,

                                    "Snap_${System.currentTimeMillis()}.jpg"
                                )

                                put(
                                    MediaStore
                                        .MediaColumns
                                        .MIME_TYPE,
                                    "image/jpeg"
                                )

                                if (
                                    Build.VERSION.SDK_INT >= 29
                                ) {

                                    put(
                                        MediaStore
                                            .MediaColumns
                                            .RELATIVE_PATH,

                                        Environment
                                            .DIRECTORY_PICTURES
                                            +
                                            "/VideoPlayer"
                                    )
                                }
                            }

                    val uri =
                        contentResolver.insert(
                            MediaStore
                                .Images
                                .Media
                                .EXTERNAL_CONTENT_URI,
                            values
                        )

                    if (uri != null) {

                        contentResolver
                            .openOutputStream(uri)
                            ?.use {

                                bitmap.compress(
                                    Bitmap.CompressFormat.JPEG,
                                    95,
                                    it
                                )
                            }

                        showIndicator(
                            "Photo saved"
                        )
                    }

                    bitmap.recycle()
                }
            }

            private fun setupGestures() {

                scaleDetector =
                    ScaleGestureDetector(

                        this,

                        object :
                            ScaleGestureDetector
                                .SimpleOnScaleGestureListener() {

                            override fun onScale(
                                detector:
                                    ScaleGestureDetector
                            ): Boolean {

                                if (
                                    zoomMode != 2
                                )
                                    return false

                                customScale =
                                    (
                                        customScale *
                                        detector.scaleFactor
                                    ).coerceIn(
                                        1f,
                                        4f
                                    )

                                applyZoomAndPan()

                                showIndicator(
                                    "Zoom ${(customScale * 100).toInt()}%"
                                )

                                return true
                            }
                        }
                    )

                gd =
                    GestureDetector(

                        this,

                        object :
                            GestureDetector
                                .SimpleOnGestureListener() {

                            override fun
                                onSingleTapConfirmed(
                                    e: MotionEvent
                                ): Boolean {

                                if (isLock)
                                    return false

                                val visibility =
                                    if (
                                        bottomBar.visibility ==
                                        View.VISIBLE
                                    )
                                        View.GONE
                                    else
                                        View.VISIBLE

                                topBar.visibility =
                                    visibility

                                bottomBar.visibility =
                                    visibility

                                btnLock.visibility =
                                    visibility

                                rightControls.visibility =
                                    visibility

                                return true
                            }

                            override fun onDoubleTap(
                                e: MotionEvent
                            ): Boolean {

                                if (isLock)
                                    return false

                                val current =
                                    player?.currentPosition
                                        ?: 0L

                                val forward =
                                    e.x >
                                    resources
                                        .displayMetrics
                                        .widthPixels / 2f

                                player?.seekTo(

                                    if (forward)

                                        current + 10000

                                    else

                                        (current - 10000)
                                            .coerceAtLeast(0)
                                )

                                showIndicator(

                                    if (forward)
                                        "+10 seconds"
                                    else
                                        "-10 seconds"
                                )

                                return true
                            }

                            override fun onScroll(
                                e1: MotionEvent?,
                                e2: MotionEvent,
                                distanceX: Float,
                                distanceY: Float
                            ): Boolean {

                                if (
                                    isLock ||
                                    e1 == null
                                )
                                    return false

                                val width =
                                    resources
                                        .displayMetrics
                                        .widthPixels

                                if (
                                    e2.pointerCount >= 2 &&
                                    zoomMode == 2
                                ) {

                                    transX -=
                                        distanceX

                                    transY -=
                                        distanceY

                                    applyZoomAndPan()

                                    return true
                                }

                                if (
                                    abs(distanceX) >
                                    abs(distanceY)
                                ) {

                                    if (
                                        !isSeekingViaSwipe
                                    ) {

                                        isSeekingViaSwipe =
                                            true

                                        swipeSeekPos =
                                            player?.currentPosition
                                                ?: 0L
                                    }

                                    val duration =
                                        player?.duration
                                            ?: 0L

                                    swipeSeekPos =
                                        (
                                            swipeSeekPos +
                                            (
                                                -distanceX * 100
                                            ).toLong()
                                        ).coerceIn(
                                            0L,
                                            duration.coerceAtLeast(0)
                                        )

                                    showIndicator(
                                        "${fmtTime(swipeSeekPos)} / ${fmtTime(duration)}"
                                    )

                                    return true
                                }

                                if (
                                    e1.x >
                                    width / 2f
                                ) {

                                    curVolProgress =
                                        (
                                            curVolProgress +
                                            (
                                                distanceY / 70f
                                            )
                                        ).coerceIn(
                                            0f,
                                            maxVol.toFloat()
                                        )

                                    am.setStreamVolume(
                                        AudioManager.STREAM_MUSIC,
                                        curVolProgress.toInt(),
                                        0
                                    )

                                    showIndicator(
                                        "Volume ${((curVolProgress / maxVol) * 100).toInt()}%"
                                    )

                                } else {

                                    curBri =
                                        (
                                            curBri +
                                            (
                                                distanceY / 2500f
                                            )
                                        ).coerceIn(
                                            0.01f,
                                            1f
                                        )

                                    window.attributes =
                                        window.attributes.apply {
                                            screenBrightness =
                                                curBri
                                        }

                                    showIndicator(
                                        "Brightness ${(curBri * 100).toInt()}%"
                                    )
                                }

                                return true
                            }
                        }
                    )

                pv.setOnTouchListener { _, event ->

                    scaleDetector
                        .onTouchEvent(event)

                    gd.onTouchEvent(event)

                    if (
                        event.actionMasked ==
                        MotionEvent.ACTION_UP
                        ||
                        event.actionMasked ==
                        MotionEvent.ACTION_CANCEL
                    ) {

                        if (
                            isSeekingViaSwipe
                        ) {

                            player?.seekTo(
                                swipeSeekPos
                            )

                            isSeekingViaSwipe =
                                false
                        }

                        handler.postDelayed(
                            {
                                txtInd.visibility =
                                    View.GONE
                            },
                            1000
                        )
                    }

                    true
                }
            }

            private fun showIndicator(
                message: String
            ) {

                txtInd.text =
                    message

                txtInd.visibility =
                    View.VISIBLE

                handler.removeCallbacksAndMessages(
                    null
                )

                handler.postDelayed(
                    {
                        txtInd.visibility =
                            View.GONE
                    },
                    1200
                )
            }

            override fun onDestroy() {

                handler.removeCallbacksAndMessages(
                    null
                )

                runCatching {
                    unregisterReceiver(
                        batteryReceiver
                    )
                }

                player?.release()
                player = null

                super.onDestroy()
            }
        }

        EOF


    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Video-Manager-Pro-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
